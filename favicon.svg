<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Metallic Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Outer Collar Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Icon Surface -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Barbell Graphic with Glow -->
  <g filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="76" y="242" width="360" height="28" rx="14" fill="url(#barGrad)" />

    <!-- Center Knurling Grips -->
    <rect x="226" y="240" width="60" height="32" rx="6" fill="#475569" opacity="0.6" />
    <line x1="241" y1="240" x2="241" y2="272" stroke="#64748b" stroke-width="2" />
    <line x1="256" y1="240" x2="256" y2="272" stroke="#64748b" stroke-width="2" />
    <line x1="271" y1="240" x2="271" y2="272" stroke="#64748b" stroke-width="2" />

    <!-- LEFT WEIGHT PLATES -->
    <!-- Inner Stop Collar -->
    <rect x="176" y="234" width="16" height="44" rx="5" fill="url(#collarGrad)" />

    <!-- Main Large Plate 1 -->
    <rect x="146" y="160" width="24" height="192" rx="8" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />
    <!-- Plate Ridge Highlight -->
    <rect x="150" y="170" width="5" height="172" rx="2" fill="#93c5fd" opacity="0.6" />

    <!-- Mid Plate 2 -->
    <rect x="116" y="184" width="24" height="144" rx="8" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />
    <rect x="120" y="194" width="5" height="124" rx="2" fill="#93c5fd" opacity="0.6" />

    <!-- Outer Small Plate 3 -->
    <rect x="90" y="208" width="20" height="96" rx="6" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />

    <!-- End Sleeve Cap -->
    <rect x="70" y="244" width="16" height="24" rx="4" fill="url(#collarGrad)" />

    <!-- RIGHT WEIGHT PLATES -->
    <!-- Inner Stop Collar -->
    <rect x="320" y="234" width="16" height="44" rx="5" fill="url(#collarGrad)" />

    <!-- Main Large Plate 1 -->
    <rect x="342" y="160" width="24" height="192" rx="8" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />
    <rect x="346" y="170" width="5" height="172" rx="2" fill="#93c5fd" opacity="0.6" />

    <!-- Mid Plate 2 -->
    <rect x="372" y="184" width="24" height="144" rx="8" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />
    <rect x="376" y="194" width="5" height="124" rx="2" fill="#93c5fd" opacity="0.6" />

    <!-- Outer Small Plate 3 -->
    <rect x="402" y="208" width="20" height="96" rx="6" fill="url(#plateGrad)" stroke="#60a5fa" stroke-width="2" />

    <!-- End Sleeve Cap -->
    <rect x="426" y="244" width="16" height="24" rx="4" fill="url(#collarGrad)" />
  </g>
</svg>
